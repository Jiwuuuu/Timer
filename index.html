<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A focused countdown timer with Pomodoro cycles, presets and keyboard control.">
    <meta name="color-scheme" content="dark light">
    <title>Timer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9201;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <header class="topbar">
            <h1 class="brand">Timer</h1>

            <div class="mode-switch" role="group" aria-label="Timer mode">
                <button type="button" id="mode-timer" class="mode-switch__btn is-active" aria-pressed="true">Timer</button>
                <button type="button" id="mode-pomodoro" class="mode-switch__btn" aria-pressed="false">Pomodoro</button>
            </div>

            <div class="topbar__actions">
                <button type="button" id="sound-btn" class="icon-btn" aria-pressed="true" title="Sound (M)">
                    <span class="icon-btn__glyph" aria-hidden="true">&#9834;</span>
                    <span class="sr-only">Toggle sound</span>
                </button>
                <button type="button" id="theme-btn" class="icon-btn" title="Theme (T)">
                    <span class="icon-btn__glyph" id="theme-glyph" aria-hidden="true">&#9788;</span>
                    <span class="sr-only">Change theme</span>
                </button>
            </div>
        </header>

        <main class="stage">

            <p class="phase" id="phase-label" hidden>Focus</p>

            <div class="dial" id="dial">
                <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
                    <circle class="ring__track" cx="120" cy="120" r="108" pathLength="100"></circle>
                    <circle class="ring__bar" id="ring-bar" cx="120" cy="120" r="108" pathLength="100"></circle>
                </svg>

                <div class="dial__center">
                    <button type="button" class="time" id="time-display" aria-label="Set duration">00:00</button>
                    <input type="text" class="time-input" id="time-input" hidden
                           inputmode="numeric" autocomplete="off" spellcheck="false"
                           aria-label="Duration, for example 25 or 5:30 or 1h 30m">
                    <p class="dial__hint" id="dial-hint">click to edit</p>
                </div>
            </div>

            <div class="presets" id="presets" role="group" aria-label="Duration presets">
                <button type="button" class="chip" data-minutes="1">1m</button>
                <button type="button" class="chip" data-minutes="5">5m</button>
                <button type="button" class="chip" data-minutes="10">10m</button>
                <button type="button" class="chip" data-minutes="15">15m</button>
                <button type="button" class="chip" data-minutes="25">25m</button>
                <button type="button" class="chip" data-minutes="45">45m</button>
                <button type="button" class="chip" data-minutes="60">60m</button>
            </div>

            <div class="phases" id="phases" role="group" aria-label="Pomodoro phase" hidden>
                <button type="button" class="chip" data-phase="focus">Focus &middot; 25m</button>
                <button type="button" class="chip" data-phase="short">Short break &middot; 5m</button>
                <button type="button" class="chip" data-phase="long">Long break &middot; 15m</button>
            </div>

            <div class="controls">
                <button type="button" id="down-btn" class="btn btn--ghost" title="Subtract 5 minutes">&minus;5</button>
                <button type="button" id="start-btn" class="btn btn--primary">Start</button>
                <button type="button" id="up-btn" class="btn btn--ghost" title="Add 5 minutes">+5</button>
                <button type="button" id="reset-btn" class="btn btn--quiet">Reset</button>
            </div>

        </main>

        <footer class="footer">
            <p class="sessions" id="sessions">No sessions completed today</p>
            <p class="hints">
                <kbd>Space</kbd> start / pause
                <kbd>R</kbd> reset
                <kbd>E</kbd> edit
                <kbd>&uarr;</kbd><kbd>&darr;</kbd> &plusmn;1m
                <kbd>P</kbd> pomodoro
            </p>
        </footer>

    </div>

    <div class="toast" id="toast" hidden></div>
    <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

    <script src="script.js"></script>
</body>
</html>
